function card(title,body,extra=''){return `<article class="card ${extra}"><h3>${title}</h3>${body}</article>`}function button(a,e,action,cls='btn'){return `<button class="${cls}" onclick="${action}">${t(a,e)}</button>`}function section(title,subtitle,body){return `<section class="section"><div class="sectionhead"><div><h2>${title}</h2><div class="sub">${subtitle}</div></div></div>${body}</section>`}
function videoCard(){return `<div class="video"><video controls playsinline preload="metadata" poster="" aria-label="RAMIH brand introduction"><source src="${VIDEO}" type="video/mp4"></video><div class="videofoot">${t('فيديو هوية رامح الأصلي · 8 ثوانٍ · بدون صوت','Original RAMIH brand motion · 8 seconds · silent')}</div></div>`}
function postCards(){return posts.filter(p=>category==='all'||p.c===category).map(p=>`<article class="card"><div class="thumb">${ico}</div><div class="category">${p.c.toUpperCase()}</div><h3>${t(p.ar,p.en)}</h3><p>${t(p.descAr,p.descEn)}</p><div class="row" style="margin-top:16px">${button('اقرأ المقال','Read article',`readPost(${p.id})`,'btn ghost')}${button('☆ حفظ','☆ Save',`savePost(${p.id})`,'btn ghost')}</div></article>`).join('')}
function chart(){let data={tourism:[46,60,68,81],retail:[63,57,70,75],logistics:[40,55,72,88]}[sector];return `<div class="bars">${data.map((v,i)=>`<div style="height:${v}%"><span>Q${i+1}</span></div>`).join('')}</div><div class="chartnote">${t('قيم توضيحية لتجربة التفاعل فقط — ليست إحصاءات فعلية','Illustrative interaction values only — not real statistics')}</div>`}
function view(id){switch(id){case 'home':return `<section class="hero"><div><div class="eyebrow">RAMIH · DECISION INTELLIGENCE</div><h1>${t('لا تراقب المستقبل.<br><em>استبق القرار.</em>','Don’t just watch the future.<br><em>Stay ahead.</em>')}</h1><p class="lead">${t('منصة ذكاء اقتصادي تربط الأسواق والفرص والمعرفة بقراراتك القادمة.','Economic intelligence connecting markets, opportunities and knowledge to your next decision.')}</p><div class="cta">${button('استكشف الأسواق','Explore markets',"go('markets')",'btn primary')}${button('شاهد رامح','Watch RAMIH',"go('videos')")}</div></div>${videoCard()}</section>`+section(t('ما الذي تريد استكشافه؟','What would you like to explore?'),t('ابدأ من هدفك، لا من قائمة أنظمة','Start with your goal, not a list of systems'),`<div class="grid">${card(t('الأسواق والقطاعات','Markets & sectors'),`<p>${t('تصفح المؤشرات واتجاهات القطاعات','Explore indicators and sector trends')}</p>${button('استكشف','Explore',"go('markets')")}`)}${card(t('المعرفة والتحليلات','Insights & analysis'),`<p>${t('مقالات ووجهات نظر حول الاقتصاد والقرار','Articles on economics and decision-making')}</p>${button('اقرأ','Read',"go('insights')")}`)}${card(t('راداري الشخصي','My decision radar'),`<p>${t('اختر اهتمامك وجرّب رحلة اكتشاف الفرص','Choose interests and explore opportunities')}</p>${button('ابدأ','Start',"go('radar')")}`)}</div>`)+section(t('أحدث الرؤى','Featured insights'),t('محتوى تحريري توضيحي','Illustrative editorial content'),`<div class="grid">${postCards()}</div>`);case 'insights':return `<div class="eyebrow">RAMIH INSIGHTS</div><h1>${t('مدونة رامح','RAMIH Insights')}</h1><p class="lead">${t('معرفة تدعم القرار — مقالات تجريبية من إعداد المنصة','Knowledge for better decisions — illustrative original articles')}</p><div class="chips" id="filters">${[['all','الكل','All'],['markets','الأسواق','Markets'],['business','الأعمال','Business'],['technology','التقنية','Technology']].map(([id,a,e])=>`<button class="chip ${category===id?'on':''}" onclick="setCategory('${id}')">${t(a,e)}</button>`).join('')}</div><div class="grid" id="posts">${postCards()}</div><div id="reader" class="section"></div>`;case 'videos':return `<div class="eyebrow">RAMIH VIDEO</div><h1>${t('رامح المرئي','RAMIH Video')}</h1><p class="lead">${t('تجربة فيديو أصلية قابلة للتشغيل على الآيفون، وبداية مكتبة المحتوى المرئي.','An original playable iPhone video and the beginning of our visual library.')}</p><div class="grid">${card(t('تعرف على رامح','Meet RAMIH'),videoCard(),'span2')}${card(t('قريبًا في المكتبة','Coming to the library'),`<p>${t('شرح المؤشرات، مقابلات الخبراء، وموجزات الأسواق.','Indicator explainers, expert interviews and market briefings.')}</p><p>${t('هذه العناوين خطة محتوى وليست فيديوهات منشورة.','These are planned formats, not published videos.')}</p>`)}</div>`;case 'markets':return `<div class="eyebrow">ECONOMIC INTELLIGENCE</div><h1>${t('مرصد الأسواق','Market observatory')}</h1><p class="lead">${t('اختر قطاعًا لاستكشاف شكل لوحة التحليل التفاعلية.','Select a sector to explore the interactive analytics layout.')}</p><div class="chips">${[['tourism','السياحة','Tourism'],['retail','التجزئة','Retail'],['logistics','الخدمات اللوجستية','Logistics']].map(([id,a,e])=>`<button class="chip ${sector===id?'on':''}" onclick="setSector('${id}')">${t(a,e)}</button>`).join('')}</div><div class="grid">${card(t('اتجاه القطاع','Sector trend'),`<div id="sectorChart">${chart()}</div>`,'span2')}${card(t('قراءة المؤشرات','Reading indicators'),`<p>${t('سيتم ربط هذه اللوحة بمصادر موثوقة وتواريخ تحديث واضحة قبل عرض قيم اقتصادية حقيقية.','Verified data sources and timestamps will be required before displaying actual economic figures.')}</p>${button('قارن القطاعات','Compare sectors',"go('compare')")}`)}</div>`;case 'radar':return `<h1>${t('راداري','My radar')}</h1><div class="grid">${card('RAMIH RADAR',`<div class="radar"><div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="star">✦</div></div>`,'span2')}${card(t('اهتماماتك','Your interests'),`<div class="form"><label>${t('اختر المجال','Select an interest')}<select id="interest"><option>${t('الاستثمار','Investment')}</option><option>${t('ريادة الأعمال','Entrepreneurship')}</option><option>${t('الأسواق','Markets')}</option></select></label>${button('تخصيص الرادار','Personalize radar',"notify(t('تم تحديث العرض التوضيحي','Preview updated'))",'btn primary')}</div><p class="mini">${t('لا تُحفظ معلومات شخصية','No personal information is stored')}</p>`)}</div>`;case 'compare':return `<h1>${t('مقارنة الفرص','Compare opportunities')}</h1><div class="grid">${card(t('اختر سوقين','Choose two markets'),`<div class="form"><select id="a"><option value="j">${t('جدة','Jeddah')}</option><option value="r">${t('الرياض','Riyadh')}</option><option value="d">${t('الدمام','Dammam')}</option></select><select id="b"><option value="r">${t('الرياض','Riyadh')}</option><option value="j">${t('جدة','Jeddah')}</option><option value="d">${t('الدمام','Dammam')}</option></select>${button('قارن','Compare',"compare()",'btn primary')}<div id="compareOut" class="mini"></div></div>`,'span2')}${card(t('منهجية المقارنة','Comparison methodology'),`<p>${t('السوق، الطلب، المنافسة، التكلفة والمخاطر. لا توجد درجات مصطنعة على أنها حقائق.','Market, demand, competition, cost and risk. No invented scores presented as facts.')}</p>`)}</div>`;case 'profile':return `<h1>${t('ملفي الشخصي','My profile')}</h1><div class="grid">${card(t('تفضيلات التجربة','Experience preferences'),`<div class="form"><label>${t('نوع الحساب','Account type')}<select><option>${t('فرد','Individual')}</option><option>${t('منشأة','Organization')}</option></select></label><label>${t('الاهتمام','Interest')}<select><option>${t('اقتصاد وأسواق','Economy & markets')}</option><option>${t('ريادة الأعمال','Entrepreneurship')}</option></select></label>${button('تجربة الحفظ','Preview save',"notify(t('هذه معاينة دون حسابات حقيقية','Preview only: no real accounts'))",'btn primary')}</div>`,'span2')}${card(t('الخصوصية أولًا','Privacy first'),`<p>${t('هذه المعاينة لا تسجل بيانات حسابات أو عملاء.','This preview does not register user or customer accounts.')}</p>`)}</div>`;case 'crm':return `<h1>CRM</h1><div class="notice">${t('مساحة توضيحية عامة؛ ليست نظام CRM حقيقيًا. لا تدخل بيانات عملاء.','Public illustrative workspace; not a real CRM. Do not enter customer data.')}</div><div class="grid">${card(t('مراحل العملاء','Lead stages'),`<div class="tabler"><table><tr><th>${t('العميل','Lead')}</th><th>${t('المرحلة','Stage')}</th></tr><tr><td>Demo 01</td><td>${t('جديد','New')}</td></tr><tr><td>Demo 02</td><td>${t('متابعة','Follow-up')}</td></tr><tr><td>Demo 03</td><td>${t('مهتم','Interested')}</td></tr></table></div>`,'span2')}${card(t('القنوات المخطط لها','Planned channels'),`<p>Email · LinkedIn · X · Web · Mobile</p><p>${t('لم تُربط حسابات خارجية','No external accounts connected')}</p>`)}</div>`;case 'cms':return `<h1>CMS</h1><div class="notice">${t('محرر تجريبي دون حفظ أو نشر فعلي.','Demonstration editor without real saving or publishing.')}</div><div class="grid">${card(t('محرر المقالات','Article editor'),`<div class="form"><input placeholder="${t('عنوان تجريبي','Demo title')}"><textarea placeholder="${t('نص تجريبي فقط','Demo text only')}"></textarea>${button('معاينة النشر','Preview publishing',"notify(t('لم يُنشر أي محتوى','No content was published'))",'btn primary')}</div>`,'span2')}${card(t('سير الموافقات','Approval workflow'),`<p>${t('مسودة ← مراجعة ← اعتماد ← نشر','Draft → Review → Approval → Publish')}</p>`)}</div>`;case 'admin':return `<h1>${t('الحوكمة والإدارة','Governance & administration')}</h1><div class="notice">${t('هذه شاشة شرح فقط؛ لوحة الإدارة الفعلية يجب أن تكون على خادم خاص مع مصادقة وصلاحيات.','Concept screen only; real administration requires private backend authentication and authorization.')}</div><div class="grid">${card(t('التحكم في الوصول','Access control'),`<p>RBAC · MFA · Least privilege</p>`)}${card(t('سجلات التدقيق','Audit logging'),`<p>${t('تُنفّذ على الخادم الآمن','Implemented on a secure backend')}</p>`)}${card(t('الخصوصية','Privacy governance'),`<p>PDPL · Consent · Retention · Deletion</p>`)}</div>`}}
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.getElementById('brandname').textContent=t('رامح','RAMIH');document.getElementById('ar').classList.toggle('on',lang==='ar');document.getElementById('en').classList.toggle('on',lang==='en');document.getElementById('nav').innerHTML=ids.map((id,i)=>`<button data-id="${id}" onclick="go('${id}')">${names[lang][i]}</button>`).join('');document.getElementById('tickerLabel').textContent=t('مرصد الأسواق','MARKET WATCH');let tick=[['TASI','مؤشر السوق السعودي','Saudi market'],['BRENT','خام برنت','Brent crude'],['GOLD','الذهب','Gold'],['USD/SAR','الدولار / الريال','USD / SAR'],['CPI','التضخم','Inflation']];document.getElementById('ticker').innerHTML=[...tick,...tick].map(([id,a,e])=>`<span><b>${id}</b> · ${t(a,e)} · ${t('بيانات قيد الربط','Feed pending')}</span>`).join('');document.getElementById('footerNotice').textContent=t('معاينة تصميمية · لا بيانات مالية حية','Design preview · No live market data');document.getElementById('views').innerHTML=ids.map(id=>`<section class="view" id="view-${id}">${view(id)}</section>`).join('');activate()}
function activate(){let id=location.hash.slice(1);if(!ids.includes(id))id='home';document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='view-'+id));document.querySelectorAll('.nav button').forEach(e=>{e.classList.toggle('on',e.dataset.id===id);e.setAttribute('aria-current',e.dataset.id===id?'page':'false')})}function go(id){if(location.hash==='#'+id)activate();else location.hash=id;window.scrollTo({top:0,behavior:'smooth'})}function setCategory(id){category=id;render()}function setSector(id){sector=id;render()}function notify(s){let el=document.getElementById('toast');el.textContent=s;el.style.display='block';setTimeout(()=>el.style.display='none',2600)}function savePost(id){if(saved.has(id))saved.delete(id);else saved.add(id);notify(t('تم تحديث المحفوظات في هذه الجلسة فقط','Session bookmarks updated'))}function readPost(id){let p=posts.find(x=>x.id===id);go('insights');setTimeout(()=>{let el=document.getElementById('reader');if(el){el.innerHTML=card(t(p.ar,p.en),`<p>${t(p.descAr,p.descEn)}</p><p>${t('هذه مسودة افتتاحية قصيرة لمعاينة أسلوب القراءة، وليست تقريرًا اقتصاديًا منشورًا أو توصية استثمارية.','A short editorial preview of the reading experience, not a published economic report or investment advice.')}</p>`);el.scrollIntoView({behavior:'smooth'})}},70)}function compare(){let a=document.getElementById('a'),b=document.getElementById('b');document.getElementById('compareOut').textContent=a.value===b.value?t('اختر مدينتين مختلفتين','Choose different cities'):t('تم اختيار السوقين. ستظهر المؤشرات الموثقة عند ربط مصادر البيانات.','Markets selected. Verified metrics will appear when data sources are connected.')}document.getElementById('ar').onclick=()=>{lang='ar';render()};document.getElementById('en').onclick=()=>{lang='en';render()};window.addEventListener('hashchange',activate);render();
</script></body></html>
