e}}</style></head><body><div class="ambient"></div><div class="wrap"><header><div class="brand"><span class="brand-star" aria-hidden="true">✧</span> <span id="brand">رامح</span><small>RAMIH</small></div><div class="tools"><div class="langs" aria-label="Language"><button id="ar" class="active" aria-pressed="true">AR</button><button id="en" aria-pressed="false">EN</button></div></div></header><div class="divider"></div><main class="hero"><section><div class="kicker" id="kicker">COMING SOON · قريبًا</div><h1 id="headline">المستقبل لا ينتظر.<br><span>استبق القرار.</span></h1><p class="desc" id="desc">رامح. ذكاء اقتصادي يكشف ما وراء الأرقام، ويمنحك رؤية أوضح للأسواق والفرص والقرارات القادمة.</p><div class="coming"><i class="pulse"></i><span id="status">نعمل على تجربة جديدة تستحق الانتظار</span></div></section><div class="visual" aria-hidden="true"><div class="orbit"></div><div class="orbit"></div><div class="orbit"></div><div class="star-mark"><svg viewBox="0 0 200 200" role="img" aria-label="RAMIH star"><defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0b9"/><stop offset=".48" stop-color="#d6b477"/><stop offset="1" stop-color="#a97633"/></linearGradient></defs><path d="M100 7 L114 85 L193 100 L114 115 L100 193 L86 115 L7 100 L86 85 Z" fill="url(#gold)"/><path d="M100 7 L100 100 L193 100 L114 85Z" fill="#ffe8a5" opacity=".72"/><path d="M100 193 L100 100 L7 100 L86 115Z" fill="#a97838" opacity=".6"/><path d="M144 38 A73 73 0 0 1 168 141" fill="none" stroke="#40c7b0" stroke-width="3" stroke-linecap="round"/><path d="M168 141 l-11 -6 l4 14" fill="none" stroke="#40c7b0" stroke-width="3" stroke-linejoin="round"/></svg></div></div></main><footer><span id="foot">انطلاقة سعودية. طموح عالمي.</span><span>© <span id="year"></span> RAMIH</span></footer></div><script>document.getElementById('year').textContent=new Date().getFullYear();const content={ar:{brand:'رامح',kicker:'COMING SOON · قريبًا',headline:'المستقبل لا ينتظر.<br><span>استبق القرار.</span>',desc:'رامح. ذكاء اقتصادي يكشف ما وراء الأرقام، ويمنحك رؤية أوضح للأسواق والفرص والقرارات القادمة.',status:'نعمل على تجربة جديدة تستحق الانتظار',foot:'انطلاقة سعودية. طموح عالمي.'},en:{brand:'RAMIH',kicker:'COMING SOON',headline:'The future won’t wait.<br><span>Stay ahead.</span>',desc:'RAMIH. Economic intelligence that goes beyond the numbers, bringing clarity to markets, opportunities and your next decision.',status:'A new intelligence experience is on its way',foot:'Saudi-born. Globally minded.'}};function setLang(lang){let t=content[lang];for(let k of Object.keys(t))document.getElementById(k).innerHTML=t[k];document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';for(let x of ['ar','en']){let a=document.getElementById(x);a.classList.toggle('active',x===lang);a.setAttribute('aria-pressed',String(x===lang))}}document.getElementById('ar').onclick=()=>setLang('ar');document.getElementById('en').onclick=()=>setLang('en');</script></body></html>
